[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neofoam_ui"
version = "0.1.0"
description = "trame UI plugin for NeoFOAM: step through the solver DAG like an activity simulation"
authors = [{ name = "Henning Scheufler", email = "henning.scheufler@web.de" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "trame>=3.12,<4",
    "trame-vuetify>=3.0",
    "trame-flow>=2.2.2",
    "trame-plotly>=3.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
neofoam-ui = "neofoam_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the helper solvers the tests import (worker processes get them on their own PYTHONPATH)
pythonpath = ["tests/helpers"]
