[workspace]
authors = ["Henning Scheufler <henning.scheufler@web.de>"]
channels = ["conda-forge"]
name = "neofoam_ui"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
numpy = "*"
pytest = "*"

[pypi-dependencies]
neofoam_ui = { path = ".", editable = true }

[tasks]
ui = "neofoam-ui"
test = "pytest -q"

# Optional: ParaView 6.2 for `neofoam-ui --catalyst scripts/catalyst_pipeline.py`
# (about 2.4 GB; `pixi run -e catalyst ...`). The default environment stays without it.
[feature.catalyst.dependencies]
paraview = "6.2.*"

[environments]
catalyst = ["catalyst"]
